<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saad Sanaan Hayyu</title>
<meta name="description" content="Kontaktdaten und Lebenslauf von Saad Sanaan Hayyu, Bremen.">
<link rel="icon" href="data:,">
<style>
  :root{
    --tinte:#16283C;
    --papier:#F7F6F3;
    --akzent:#B0552F;
    --grau:#5A6672;
    --linie:#DDE0E4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--papier);
    color:var(--tinte);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    line-height:1.45;
    min-height:100vh;
  }
  .huelle{max-width:30rem;margin:0 auto;background:var(--papier);min-height:100vh}

  /* ---- Kopf ---- */
  .kopf{
    background:var(--tinte);
    color:#fff;
    padding:2.4rem 1.5rem 2rem;
    display:flex;
    align-items:center;
    gap:1.1rem;
  }
  .kopf img{
    width:5rem;height:5rem;
    border-radius:50%;
    object-fit:cover;
    object-position:center 22%;
    border:2px solid var(--akzent);
    flex:0 0 auto;
  }
  .name{
    font-size:1.65rem;
    font-weight:400;
    letter-spacing:-.015em;
    line-height:1.15;
  }
  .name b{font-weight:700}
  .rolle{
    margin-top:.35rem;
    font-size:.86rem;
    color:rgba(255,255,255,.72);
  }

  /* ---- Aktionen ---- */
  .aktionen{padding:1.5rem 1.5rem .5rem}
  .knopf{
    display:block;
    width:100%;
    padding:1.05rem 1.2rem;
    margin-bottom:.7rem;
    font-size:1.02rem;
    font-weight:700;
    text-decoration:none;
    text-align:left;
    border:1.5px solid var(--tinte);
    color:var(--tinte);
    background:transparent;
  }
  .knopf.voll{background:var(--tinte);color:#fff;border-color:var(--tinte)}
  .knopf span{
    display:block;
    font-size:.8rem;
    font-weight:400;
    margin-top:.15rem;
    color:var(--grau);
  }
  .knopf.voll span{color:rgba(255,255,255,.68)}
  .knopf:focus-visible{outline:3px solid var(--akzent);outline-offset:2px}
  .nebenlink{margin:.15rem 0 .3rem;font-size:.83rem}
  .nebenlink a{color:var(--grau);text-decoration:none;border-bottom:1px solid var(--linie);padding-bottom:1px}

  /* ---- Direktkontakt ---- */
  .direkt{padding:.9rem 1.5rem 1rem}
  .zeile{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:1rem;
    padding:.85rem 0;
    border-top:1px solid var(--linie);
    font-size:.94rem;
  }
  .zeile:last-of-type{border-bottom:1px solid var(--linie)}
  .zeile dt{color:var(--grau);font-size:.82rem}
  .zeile dd a{color:var(--tinte);text-decoration:none;border-bottom:1.5px solid var(--akzent);padding-bottom:1px}
  .fuss{
    margin-top:1.6rem;
    font-size:.82rem;
    color:var(--grau);
  }
  /* ---- Tresor ---- */
  .tresor{padding:0 1.5rem 7rem}
  .schloss{background:none;border:0;padding:.4rem 0;font:inherit;font-size:.85rem;color:var(--grau);cursor:pointer}
  .pw{display:flex;gap:.5rem;margin-top:.4rem}
  .pw[hidden],.offen[hidden],.pwhinweis[hidden],.schloss[hidden]{display:none}
  .schlossbox{border-top:1px solid var(--linie);padding:.35rem 0}
  .schlossbox:first-child{border-top:0}
  .schlossbox:last-child{border-bottom:1px solid var(--linie)}
  .pw input{flex:1;min-width:0;padding:.8rem;font-size:1rem;border:1.5px solid var(--tinte);background:#fff;color:var(--tinte);font-family:inherit}
  .pw button{padding:.8rem 1rem;font-weight:700;border:0;background:var(--tinte);color:#fff;font-family:inherit;font-size:.95rem;cursor:pointer}
  .pwhinweis{margin-top:.5rem;font-size:.85rem;color:var(--akzent)}
  .offen{margin-top:.6rem;padding-bottom:.4rem}
  .schloss{display:block;width:100%;text-align:left}
  .sperren{margin-top:1rem;background:none;border:0;padding:.3rem 0;font:inherit;font-size:.82rem;color:var(--grau);text-decoration:underline;cursor:pointer}

  /* ---- Spiel ---- */
  .spielknopf{
    position:fixed;right:1.1rem;bottom:1.1rem;z-index:10;
    height:3.6rem;padding:0 1.3rem 0 1.05rem;border-radius:1.8rem;gap:.5rem;
    font-size:1rem;font-weight:700;font-family:inherit;
    background:var(--akzent);color:#fff;border:0;cursor:pointer;
    box-shadow:0 4px 14px rgba(22,40,60,.3);
    display:flex;align-items:center;justify-content:center;
  }
  .spielknopf:focus-visible{outline:3px solid var(--tinte);outline-offset:3px}
  .spielknopf svg{width:1.7rem;height:1.7rem}
  .spielfenster{position:fixed;inset:0;z-index:20;background:var(--tinte);display:none}
  .spielfenster.offen{display:block}
  .spielfenster iframe{width:100%;height:100%;border:0;display:block}
  .schliessen{
    position:absolute;top:.9rem;right:1rem;z-index:2;
    width:2.6rem;height:2.6rem;border-radius:50%;border:0;cursor:pointer;
    background:rgba(255,255,255,.14);color:#fff;font-size:1.4rem;line-height:1;
  }
</style>
</head>
<body>
<main class="huelle">

  <header class="kopf">
    <img src="foto.jpg" alt="Porträt von Saad Sanaan Hayyu">
    <div>
      <h1 class="name">Saad Sanaan <b>Hayyu</b></h1>
      <p class="rolle">Student der Sozialen Arbeit, Bremen</p>
    </div>
  </header>

  <nav class="aktionen">

  <section class="direkt">

      <div class="zeile">

        <dd><a href="mailto:saadhyderabad200@gmail.com">saadhyderabad200@gmail.com</a></dd>

      <button class="schloss" type="button">🔒 Lebenslauf + Persönlichkeitsprofil</button>
      <form class="pw" hidden>
        <input type="password" placeholder="Passwort" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Passwort für Lebenslauf und Persönlichkeitsprofil">
        <button type="submit">Öffnen</button>
      </form>
      <p class="pwhinweis" hidden></p>
      <div class="offen" hidden><div class="dokus"></div><p class="fuss notiz"></p><button class="sperren" type="button">Wieder sperren</button></div>
    </div>

</main>
<button class="spielknopf" id="spielAuf" aria-label="Spiel Bremen Jetpack öffnen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c3 2 4 5 4 9v5H8v-5c0-4 1-7 4-9z"/><path d="M8 13l-3 3v3l3-2M16 13l3 3v3l-3-2"/><path d="M10 19c0 2 1 3 2 3s2-1 2-3"/></svg>
  Spielen
</button>
<div class="spielfenster" id="spiel" role="dialog" aria-label="Bremen Jetpack">
  <button class="schliessen" id="spielZu" aria-label="Spiel schließen">&times;</button>
</div>
<script>
(function(){
  var f=document.getElementById('spiel');
  document.getElementById('spielAuf').onclick=function(){
    if(!f.querySelector('iframe')){var i=document.createElement('iframe');i.src='spiel.html';i.title='Bremen Jetpack';f.appendChild(i)}
    f.classList.add('offen');document.body.style.overflow='hidden';
    setTimeout(function(){var i=f.querySelector('iframe');i&&i.focus()},50);
  };
  document.getElementById('spielZu').onclick=function(){f.classList.remove('offen');document.body.style.overflow=''};
  addEventListener('keydown',function(e){if(e.key==='Escape')document.getElementById('spielZu').click()});
})();
</script>
<script>
(function(){
  var SALZE={a:'BJm7GoJd6WttfAAez+VqTw==',b:'TFg2ZiAWoT61jQMv/bDLFg=='},RUNDEN=310000,TAGE=5;
  if(!window.crypto||!crypto.subtle){document.getElementById('tresor').hidden=true;return}
  function b64d(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
  function b64e(u){u=new Uint8Array(u);var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
  function entschluesseln(key,url){
    return fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('fehlt');return r.arrayBuffer()}).then(function(b){
      b=new Uint8Array(b);return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12))})
  }
  document.querySelectorAll('.schlossbox').forEach(function(box){
    var id=box.dataset.id,ordner='tresor/'+id+'/',speicher='tresor-'+id,blobs=[];
    var q=function(sel){return box.querySelector(sel)},knopf=q('.schloss'),form=q('.pw'),feld=q('input'),los=q('.pw button'),hinweis=q('.pwhinweis'),offen=q('.offen');
    function ausPasswort(pw){
      return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(basis){
        return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(SALZE[id]),iterations:RUNDEN,hash:'SHA-256'},basis,{name:'AES-GCM',length:256},true,['decrypt'])})
    }
    function oeffnen(key){
      return entschluesseln(key,ordner+'inhalt.enc').then(function(roh){
        var inh=JSON.parse(new TextDecoder().decode(roh));
        return Promise.all(inh.dokumente.map(function(d){return entschluesseln(key,ordner+d.datei).then(function(pdf){return{d:d,pdf:pdf}})})).then(function(liste){
          var ziel=q('.dokus');ziel.innerHTML='';
          liste.forEach(function(e){
            var url=URL.createObjectURL(new Blob([e.pdf],{type:'application/pdf'}));blobs.push(url);
            var a=document.createElement('a');a.className='knopf';a.href=url;a.target='_blank';a.rel='noopener';
            a.textContent=e.d.titel;var sp=document.createElement('span');sp.textContent=e.d.info||'';a.appendChild(sp);ziel.appendChild(a);
          });
          q('.notiz').textContent=inh.notiz||'';
          form.hidden=true;hinweis.hidden=true;knopf.hidden=true;offen.hidden=false;
        });
      });
    }
    function merken(key){return crypto.subtle.exportKey('raw',key).then(function(raw){
      try{localStorage.setItem(speicher,JSON.stringify({k:b64e(raw),bis:Date.now()+TAGE*864e5}))}catch(e){}})}
    function sperren(){
      try{localStorage.removeItem(speicher)}catch(e){}
      blobs.forEach(function(u){URL.revokeObjectURL(u)});blobs=[];
      q('.dokus').innerHTML='';offen.hidden=true;knopf.hidden=false;form.hidden=true;feld.value='';
    }
    knopf.onclick=function(){form.hidden=!form.hidden;if(!form.hidden)feld.focus()};
    form.addEventListener('submit',function(e){
      e.preventDefault();var pw=feld.value;if(!pw)return;
      los.disabled=true;los.textContent='…';hinweis.hidden=true;
      ausPasswort(pw).then(function(key){return oeffnen(key).then(function(){return merken(key)})})
        .catch(function(){hinweis.textContent='Das Passwort stimmt nicht.';hinweis.hidden=false})
        .then(function(){los.disabled=false;los.textContent='Öffnen'});
    });
    q('.sperren').onclick=sperren;
    try{
      var g=JSON.parse(localStorage.getItem(speicher)||'null');
      if(g&&g.bis>Date.now())crypto.subtle.importKey('raw',b64d(g.k),{name:'AES-GCM'},false,['decrypt']).then(oeffnen).catch(sperren);
      else if(g)localStorage.removeItem(speicher);
    }catch(e){}
  });
  try{localStorage.removeItem('tresor-v1')}catch(e){}
})();
</script>
</body>
</html>
