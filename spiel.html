<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Stapeln</title>
<link rel="icon" href="data:,">
<style>
  :root{--tinte:#16283C;--papier:#F7F6F3;--akzent:#B0552F;--grau:#5A6672}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--tinte);touch-action:manipulation;-webkit-user-select:none;user-select:none}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff}
  canvas{display:block;width:100%;height:100%}
  .hud{position:fixed;top:0;left:0;padding:1.2rem 1.5rem;pointer-events:none}
  .punkte{font-size:2.6rem;font-weight:700;line-height:1}
  .rekord{margin-top:.35rem;font-size:.82rem;color:rgba(255,255,255,.65)}
  .hinweis{position:fixed;left:0;right:0;top:30%;text-align:center;pointer-events:none;transition:opacity .3s}
  .hinweis b{display:block;font-size:1.4rem;margin-bottom:.3rem}
  .hinweis span{font-size:.9rem;color:rgba(255,255,255,.7)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div class="punkte" id="p">0</div><div class="rekord" id="r"></div></div>
<div class="hinweis" id="h"><b>Stapeln</b><span>Tippen, um den Block abzusetzen</span></div>
<script>
(function(){
  var c=document.getElementById('c'),x=c.getContext('2d');
  var pEl=document.getElementById('p'),rEl=document.getElementById('r'),hEl=document.getElementById('h');
  var W,H,dpr,BH,stapel,aktiv,fallend,kamera,ziel,punkte,rekord=0,status='start',tempo;
  try{rekord=parseInt(localStorage.getItem('stapel-rekord'))||0}catch(e){}
  var FARBEN=['#B0552F','#D68C60','#F7F6F3','#788CA0'];function farbe(i){return FARBEN[i%4]}
  function groesse(){dpr=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);BH=Math.max(22,Math.round(H/22))}
  function neu(){
    var b=Math.min(W*.62,260);
    stapel=[{x:(W-b)/2,w:b,y:0}];fallend=[];kamera=0;ziel=0;punkte=0;tempo=2.4;
    naechster();pEl.textContent='0';rEl.textContent=rekord?'Rekord '+rekord:'';
  }
  function naechster(){
    var o=stapel[stapel.length-1],von=stapel.length%2?-1:1;
    aktiv={x:von<0?0:W-o.w,w:o.w,y:o.y+1,v:von<0?tempo:-tempo};
  }
  function absetzen(){
    var o=stapel[stapel.length-1],a=aktiv;
    var l=Math.max(a.x,o.x),r=Math.min(a.x+a.w,o.x+o.w),w=r-l;
    if(w<=0){fallend.push({x:a.x,w:a.w,y:a.y,vy:0,i:stapel.length});aktiv=null;ende();return}
    if(Math.abs(w-o.w)<4){w=o.w;l=o.x}else{
      if(a.x<o.x)fallend.push({x:a.x,w:o.x-a.x,y:a.y,vy:0,i:stapel.length});
      if(a.x+a.w>o.x+o.w)fallend.push({x:o.x+o.w,w:a.x+a.w-(o.x+o.w),y:a.y,vy:0,i:stapel.length});
    }
    stapel.push({x:l,w:w,y:a.y});punkte++;pEl.textContent=punkte;
    tempo=Math.min(7,tempo+.12);
    if(stapel.length*BH>H*.45)ziel=stapel.length*BH-H*.45;
    naechster();
  }
  function ende(){
    status='ende';
    if(punkte>rekord){rekord=punkte;try{localStorage.setItem('stapel-rekord',rekord)}catch(e){}}
    hEl.innerHTML='<b>'+punkte+' Blöcke</b><span>'+(punkte>=rekord&&punkte>0?'Neuer Rekord! ':'')+'Tippen für eine neue Runde</span>';
    hEl.style.opacity=1;rEl.textContent=rekord?'Rekord '+rekord:'';
  }
  function tipp(e){
    if(e)e.preventDefault();
    if(status==='start'){status='spiel';hEl.style.opacity=0;return}
    if(status==='ende'){neu();status='spiel';hEl.style.opacity=0;return}
    if(aktiv)absetzen();
  }
  c.addEventListener('pointerdown',tipp);
  addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='Enter')tipp(e)});
  function block(b,i){
    var y=H-(b.y+1)*BH+kamera-H*.12;
    x.fillStyle=farbe(i);x.fillRect(b.x,y,b.w,BH-2);
  }
  function schritt(){
    kamera+=(ziel-kamera)*.1;
    if(status==='spiel'&&aktiv){
      aktiv.x+=aktiv.v;
      if(aktiv.x+aktiv.w>W&&aktiv.v>0)aktiv.v*=-1;
      if(aktiv.x<0&&aktiv.v<0)aktiv.v*=-1;
    }
    for(var k=fallend.length-1;k>=0;k--){var f=fallend[k];f.vy+=.06;f.y-=f.vy;if(f.y<-40)fallend.splice(k,1)}
    x.fillStyle='#16283C';x.fillRect(0,0,W,H);
    for(var i=0;i<stapel.length;i++)block(stapel[i],i);
    x.globalAlpha=.55;for(k=0;k<fallend.length;k++)block(fallend[k],fallend[k].i);x.globalAlpha=1;
    if(aktiv)block(aktiv,stapel.length);
    requestAnimationFrame(schritt);
  }
  addEventListener('resize',groesse);
  groesse();neu();
  if(rekord)rEl.textContent='Rekord '+rekord;
  requestAnimationFrame(schritt);
})();
</script>
</body>
</html>
